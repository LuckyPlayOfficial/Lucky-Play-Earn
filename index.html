

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LuckyPlay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151c;color:white;font-family:Arial,sans-serif}
header{background:#19232d;padding:20px;text-align:center;color:#65db83;font-size:27px;font-weight:bold}
main{max-width:430px;margin:35px auto;padding:20px}
.card{background:#19232d;padding:25px;border-radius:15px}
h2{text-align:center}
p{color:#bac5cf;text-align:center}
input{width:100%;padding:14px;margin:9px 0;border:1px solid #394653;border-radius:8px;background:#10151c;color:white;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;background:#65db83;color:#10151c;border:0;border-radius:8px;font-weight:bold;font-size:16px}
.switch{color:#65db83;cursor:pointer;text-align:center;margin-top:20px}
.hidden{display:none}
#message{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
footer{text-align:center;color:#87939e;padding:20px;font-size:12px}
</style>
</head>
<body>

<header>🍀 LuckyPlay</header>

<main>
<div class="card" id="register">
<h2>Create Account</h2>
<p>Join LuckyPlay Demo</p>
<input id="regUsername" placeholder="Username" maxlength="30">
<input id="regEmail" type="email" placeholder="Email address">
<input id="regPassword" type="password" placeholder="Password (minimum 8 characters)">
<button onclick="register()">Create Account</button>
<div class="switch" onclick="showLogin()">Already registered? Login</div>
</div>

<div class="card hidden" id="login">
<h2>Welcome Back!</h2>
<input id="loginEmail" type="email" placeholder="Email address">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<div class="switch" onclick="showRegister()">Create an account</div>
</div>

<div class="card hidden" id="dashboard">
<h2>Welcome to LuckyPlay! 🍀</h2>
<p id="welcome"></p>
<p>Your demo account is active.</p>
<button onclick="logout()">Logout</button>
</div>

<p id="message" role="status" aria-live="polite"></p>
</main>

<footer>
LuckyPlay © 2026<br>
Demo prototype only. No real-money transactions.
</footer>

<script>
const SUPABASE_URL = "https://zyuzgbnwqrxognxnryyh.supabase.co";
const SUPABASE_KEY = "sb_publishable_wc9qFPveIuG274OhWOPqcQ_7TaINZkL";

const configured =
  SUPABASE_URL.startsWith("https://") &&
  SUPABASE_URL.includes(".supabase.co") &&
  SUPABASE_KEY.startsWith("sb_publishable_");

const client = configured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

const $ = id => document.getElementById(id);

function message(text) {
  $("message").textContent = text;
}

function show(id) {
  ["register","login","dashboard"].forEach(name =>
    $(name).classList.toggle("hidden", name !== id)
  );
  message("");
}

function showLogin(){show("login")}
function showRegister(){show("register")}

async function register() {
  if (!client) return message("Please configure your Supabase URL and Publishable Key.");

  const username = $("regUsername").value.trim();
  const email = $("regEmail").value.trim();
  const password = $("regPassword").value;

  if (!username || !email || password.length < 8) {
    return message("Enter a username, valid email and password of at least 8 characters.");
  }

  message("Creating your account...");

  const {data,error} = await client.auth.signUp({
    email,
    password,
    options: {
      data: {display_name},
      emailRedirectTo: "https://luckyplayofficial.github.io/Lucky-Play-Earn/"
    }
  });

  if (error) return message(error.message);

  if (data.session) {
    await loadDashboard(data.session);
  } else {
    message("Registration successful! Please check your email and verify your account before logging in.");
  }
}

async function login() {
  if (!client) return message("Please configure your Supabase URL and Publishable Key.");

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  message("Logging in...");

  const {data,error} = await client.auth.signInWithPassword({
    email,
    password
  });

  if (error) return message(error.message);

  await loadDashboard(data.session);
}

async function loadDashboard(session) {
  if (!session) return showLogin();

  
const { data, error } = await client
    .from("profiles")
    .select("display_name")
    .eq("id", session.user.id)
    .maybeSingle();


  if (error) {
    message("Login successful, but profile could not be loaded: " + error.message);
    return;
  }

  $("welcome").textContent =
    "Hello, " + (data?.username || session.user.email) + "!";

  show("dashboard");
}

async function logout() {
  const {error} = await client.auth.signOut();
  if (error) return message(error.message);
  show("login");
  message("You have logged out.");
}

async function initialize() {
  if (!configured) {
    return message("Setup needed: add your Supabase Project URL and Publishable Key in the code.");
  }

  const {data,error} = await client.auth.getSession();

  if (error) return message(error.message);

  if (data.session) await loadDashboard(data.session);
}

<!-- LUCKYPLAY DASHBOARD -->
<div id="luckyDashboard" style="
  display:none;
  background:#100e20;
  color:white;
  min-height:100vh;
  padding:22px;
  font-family:Arial,sans-serif;
">

  <h1 style="color:#a78bfa;">🎮 LUCKYPLAY</h1>

  <p style="color:#aaa;">WELCOME BACK!</p>
  <h2>Hello, <span id="lpPlayerName">Player</span>! 👋</h2>

  <div style="
    background:linear-gradient(135deg,#7045c5,#30205d);
    padding:24px;
    border-radius:18px;
    margin:25px 0;
  ">
    <p>YOUR GAME CREDITS</p>
    <h1 style="color:white;">1,000</h1>
    <small>Demo credits only</small>
  </div>

  <h3>CHOOSE YOUR GAME</h3>

  <div style="
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  ">

    <button onclick="lpDemo('Lucky Slots')">🎰<br>Lucky Slots</button>
    <button onclick="lpDemo('Lucky Wheel')">🎡<br>Lucky Wheel</button>
    <button onclick="lpDemo('Card Game')">🃏<br>Card Game</button>
    <button onclick="lpDemo('Daily Bonus')">🎁<br>Daily Bonus</button>

  </div>

  <p style="margin-top:30px;text-align:center;">
    🏠 Home　 🎮 Games　 👤 Profile
  </p>

</div>

<script>
function lpDemo(game) {
  alert(game + " demo coming soon!");
}
</script>
<!-- END LUCKYPLAY DASHBOARD -->

initialize();
</script>
</body>
</html>
